# Nixpacks Configuration for Laravel 13 on Railway
[phases.setup]
nixPkgs = [
  'php84',
  'php84Packages.composer',
  'nodejs_22',
  'php84Extensions.pdo_pgsql',
  'php84Extensions.pgsql',
  'php84Extensions.mbstring',
  'php84Extensions.gd',
  'php84Extensions.intl',
  'php84Extensions.zip',
  'php84Extensions.opcache'
]

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader --no-interaction',
  'npm ci --ignore-scripts || npm install --ignore-scripts'
]

[phases.build]
cmds = [
  'npm run build',
  'php artisan storage:link --force || true'
]

[start]
cmd = 'php artisan config:clear && php artisan migrate --force && php artisan db:seed --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
